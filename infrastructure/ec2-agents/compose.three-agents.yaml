name: agent-platform-three-agents

x-agent-service: &agent-service
  build:
    context: ../..
    dockerfile: infrastructure/ec2-agents/Dockerfile
  image: agent-platform/agents:local
  init: true
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=64m,mode=1777
  networks:
    - agents
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  image-generator:
    <<: *agent-service
    command: ["node", "agents/image-generator/dist/main.js"]
    environment:
      NODE_ENV: production
      IMAGE_AGENT_PORT: "8092"
      IMAGE_AGENT_DATA_DIR: /var/lib/agent
      IMAGE_AGENT_PUBLIC_BASE_URL: ${IMAGE_AGENT_PUBLIC_BASE_URL:?required}
      IMAGE_AGENT_CALLBACK_KEY_VERSION: image-agent-callback-v1
      IMAGE_AGENT_JOB_CONCURRENCY: "1"
      IMAGE_AGENT_PLANNER_MODEL: glm-4.5-flash
      ZAI_BASE_URL: https://open.bigmodel.cn/api/paas/v4
      AGENT_API_TOKEN_ENV: IMAGE_AGENT_API_TOKEN
      AGENT_CALLBACK_KEY_ENV: IMAGE_AGENT_CALLBACK_KEY_BASE64
      PROVIDER_API_KEY_ENV: ZAI_API_KEY
    secrets:
      - source: image_agent_api_token
        target: agent_api_token
      - source: image_agent_callback_key
        target: agent_callback_key
      - source: zai_api_key
        target: provider_api_key
    volumes:
      - image-generator-data:/var/lib/agent
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8092/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  qwen-ui-prototype:
    <<: *agent-service
    command: ["node", "agents/qwen-ui-prototype/dist/main.js"]
    environment:
      NODE_ENV: production
      QWEN_UI_AGENT_PORT: "8095"
      QWEN_UI_AGENT_DATA_DIR: /var/lib/agent
      QWEN_UI_AGENT_PUBLIC_BASE_URL: ${QWEN_UI_AGENT_PUBLIC_BASE_URL:?required}
      QWEN_UI_AGENT_CALLBACK_KEY_VERSION: qwen-ui-prototype-callback-v1
      QWEN_UI_AGENT_JOB_CONCURRENCY: "1"
      QWEN_UI_AGENT_MODEL: qwen-image-3.0-pro
      DASHSCOPE_IMAGE_BASE_URL: ${DASHSCOPE_IMAGE_BASE_URL:?required}
      AGENT_API_TOKEN_ENV: QWEN_UI_AGENT_API_TOKEN
      AGENT_CALLBACK_KEY_ENV: QWEN_UI_AGENT_CALLBACK_KEY_BASE64
      PROVIDER_API_KEY_ENV: QWEN_UI_DASHSCOPE_API_KEY
    secrets:
      - source: qwen_ui_agent_api_token
        target: agent_api_token
      - source: qwen_ui_agent_callback_key
        target: agent_callback_key
      - source: qwen_ui_dashscope_api_key
        target: provider_api_key
    volumes:
      - qwen-ui-prototype-data:/var/lib/agent
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8095/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  seedream-visual-design:
    <<: *agent-service
    command: ["node", "agents/seedream-visual-design/dist/main.js"]
    environment:
      NODE_ENV: production
      SEEDREAM_AGENT_PORT: "8096"
      SEEDREAM_AGENT_DATA_DIR: /var/lib/agent
      SEEDREAM_AGENT_PUBLIC_BASE_URL: ${SEEDREAM_AGENT_PUBLIC_BASE_URL:?required}
      SEEDREAM_AGENT_CALLBACK_KEY_VERSION: seedream-visual-design-callback-v1
      SEEDREAM_AGENT_JOB_CONCURRENCY: "1"
      SEEDREAM_AGENT_MODEL: doubao-seedream-5-0-lite-260128
      ARK_BASE_URL: https://ark.cn-beijing.volces.com/api/v3
      AGENT_API_TOKEN_ENV: SEEDREAM_AGENT_API_TOKEN
      AGENT_CALLBACK_KEY_ENV: SEEDREAM_AGENT_CALLBACK_KEY_BASE64
      PROVIDER_API_KEY_ENV: ARK_API_KEY
    secrets:
      - source: seedream_agent_api_token
        target: agent_api_token
      - source: seedream_agent_callback_key
        target: agent_callback_key
      - source: ark_api_key
        target: provider_api_key
    volumes:
      - seedream-visual-design-data:/var/lib/agent
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8096/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:latest
    pull_policy: always
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run"]
    user: "1000:1000"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      image-generator:
        condition: service_healthy
      qwen-ui-prototype:
        condition: service_healthy
      seedream-visual-design:
        condition: service_healthy
    networks:
      - agents
    secrets:
      - source: cloudflare_tunnel_credentials
        target: tunnel_credentials
    configs:
      - source: cloudflare_tunnel_config
        target: /etc/cloudflared/config.yml
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  agents:
    driver: bridge

volumes:
  image-generator-data:
  qwen-ui-prototype-data:
  seedream-visual-design-data:

configs:
  cloudflare_tunnel_config:
    file: ./cloudflared.three-agents.yml

secrets:
  cloudflare_tunnel_credentials:
    file: ${AGENT_SECRET_DIR:?required}/CLOUDFLARE_TUNNEL_CREDENTIALS_JSON
  image_agent_api_token:
    file: ${AGENT_SECRET_DIR:?required}/IMAGE_AGENT_API_TOKEN
  image_agent_callback_key:
    file: ${AGENT_SECRET_DIR:?required}/IMAGE_AGENT_CALLBACK_KEY_BASE64
  qwen_ui_agent_api_token:
    file: ${AGENT_SECRET_DIR:?required}/QWEN_UI_AGENT_API_TOKEN
  qwen_ui_agent_callback_key:
    file: ${AGENT_SECRET_DIR:?required}/QWEN_UI_AGENT_CALLBACK_KEY_BASE64
  qwen_ui_dashscope_api_key:
    file: ${AGENT_SECRET_DIR:?required}/QWEN_UI_DASHSCOPE_API_KEY
  seedream_agent_api_token:
    file: ${AGENT_SECRET_DIR:?required}/SEEDREAM_AGENT_API_TOKEN
  seedream_agent_callback_key:
    file: ${AGENT_SECRET_DIR:?required}/SEEDREAM_AGENT_CALLBACK_KEY_BASE64
  ark_api_key:
    file: ${AGENT_SECRET_DIR:?required}/ARK_API_KEY
  zai_api_key:
    file: ${AGENT_SECRET_DIR:?required}/ZAI_API_KEY
